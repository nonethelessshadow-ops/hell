name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check index.html was replaced
        run: |
          if grep -q CHESSVISION_PLACEHOLDER app/src/main/assets/index.html; then
            echo "::error::Replace app/src/main/assets/index.html with your ChessVision HTML file"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ChessVision-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
